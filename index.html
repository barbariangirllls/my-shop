<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBG</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #ffffff;
            color: #222;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 3px;
    color: #111111;
}
        .contact-button {
    background: none;
    border: 1px solid #222;
    padding: 10px 18px;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
}

.contact-button:hover {
    background: #222;
    color: white;
}
        .categories {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .categories button {
            border: none;
            background: #f3f3f3;
            padding: 10px 20px;
            cursor: pointer;
        }

        .categories button:hover {
            background: #222;
            color: white;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .product img {
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            background: #f3f3f3;
        }

        .product h3 {
            font-size: 16px;
        }

        .price {
            margin: 10px 0;
        }

        .buy-button {
            display: inline-block;
            background: #222;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.4);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    width: 300px;
    padding: 35px;
    position: relative;
    text-align: center;
}

.modal-content h2 {
    font-size: 22px;
    margin-bottom: 10px;
}

.modal-content p {
    color: #777;
    font-size: 13px;
    margin-bottom: 25px;
}

.close-button {
    position: absolute;
    right: 15px;
    top: 10px;
    border: none;
    background: none;
    font-size: 25px;
    cursor: pointer;
}

.contact-link {
    display: block;
    padding: 13px;
    margin-top: 10px;
    border: 1px solid #ddd;
    color: #222;
    text-decoration: none;
}

.contact-link:hover {
    background: #222;
    color: white;
}
        /* BBG Brand Layout */

body {
    margin: 0;
    padding: 0;
    background-color: #ffffff;
    color: #222222;
    font-family: Arial, Helvetica, sans-serif;
}

/* Header */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 5%;
    border-bottom: 1px solid #eeeeee;
}

/* BBG Logo */
.logo {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 3px;
}

/* Contact Button */
.contact-button {
    padding: 10px 18px;
    font-size: 11px;
    letter-spacing: 1.5px;
}
/* Shop Content Layout */

.shop-content {
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 5%;
    box-sizing: border-box;
}

.shop-content h2 {
    margin-top: 0;
    margin-bottom: 20px;
}

/* Mobile Layout */
@media (max-width: 600px) {
    .shop-content {
        padding: 0 15px;
    }
}
    </style>
</head>

<body>

    <header>
    <div class="logo">BBG</div>
    <button class="contact-button" onclick="openContact()">
        CONTACT
    </button>
</header>
    <main class="shop-content">
    <h2>Shop by Category</h2>

    <div class="categories">
        <button onclick="filterProducts('all')">All</button>
        <button onclick="filterProducts('tops')">Tops</button>
        <button onclick="filterProducts('bottoms')">Bottoms</button>
        <button onclick="filterProducts('accessories')">Accessories</button>
    </div>

    <div class="products">

        <div class="product" data-category="bottoms">
            <img src="https://placehold.co/600x800" alt="Vintage Jeans">
            <h3>Vintage Jeans</h3>
            <p class="price">RM 109</p>
            <a class="buy-button"
   href="https://wa.me/8613728008981?text=Hi%21%20I%27m%20interested%20in%20Vintage%20Jeans.%20Is%20it%20available%3F"
   target="_blank">
    How to Buy
</a>
        </div>

        <div class="product" data-category="tops">
            <img src="https://placehold.co/600x800" alt="Basic Top">
            <h3>Basic Top</h3>
            <p class="price">RM 59</p>
            <a class="buy-button"
   href="https://wa.me/8613728008981?text=Hi%21%20I%27m%20interested%20in%20Basic%20Top.%20Is%20it%20available%3F"
   target="_blank">
    How to Buy
</a>
        </div>

        <div class="product" data-category="bottoms">
            <img src="https://placehold.co/600x800" alt="Wide Leg Pants">
            <h3>Wide Leg Pants</h3>
            <p class="price">RM 99</p>
            <a class="buy-button"
   href="https://wa.me/8613728008981?text=Hi%21%20I%27m%20interested%20in%20Basic%20Top.%20Is%20it%20available%3F"
   target="_blank">
    How to Buy
</a>
        </div>

        <div class="product" data-category="accessories">
            <img src="https://placehold.co/600x800" alt="Accessories">
            <h3>Accessories</h3>
            <p class="price">RM 39</p>
            <a class="buy-button"
   href="https://wa.me/8613728008981?text=Hi%21%20I%27m%20interested%20in%20Basic%20Top.%20Is%20it%20available%3F"
   target="_blank">
    How to Buy
</a>
        </div>

    </div>
</main>
<!-- Contact Popup -->
<div id="contactModal" class="modal">

    <div class="modal-content">

        <button class="close-button" onclick="closeContact()">
            ×
        </button>

        <h2>Get in Touch</h2>
        <p>Choose your preferred contact method.</p>

        <a href="mailto:YOUR_EMAIL_ADDRESS" class="contact-link">
            Gmail ↗
        </a>

        <a href="https://wa.me/8613728008981"
           target="_blank"
           class="contact-link">
            WhatsApp ↗
        </a>

        <a href="YOUR_WECHAT_LINK" class="contact-link">
            WeChat ↗
        </a>

    </div>

</div>
    <script>
        function filterProducts(category) {
            const products = document.querySelectorAll('.product');

            products.forEach(product => {
                if (category === 'all' || product.dataset.category === category) {
                    product.style.display = 'block';
                } else {
                    product.style.display = 'none';
                }
            });
        }
        function openContact() {
    document.getElementById("contactModal").style.display = "flex";
}

function closeContact() {
    document.getElementById("contactModal").style.display = "none";
}

window.onclick = function(event) {
    const modal = document.getElementById("contactModal");

    if (event.target === modal) {
        closeContact();
    }
}
    </script>

</body>
</html>
